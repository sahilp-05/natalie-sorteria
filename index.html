<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Natalie Shopping Cart Sorteria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2414;--red:#d7262e;--cream:#fff6e6;--gold:#ffc93c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a1810;overflow:hidden;font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:960px;height:600px;margin:-300px 0 0 -480px;overflow:hidden;background:#fdf1dc;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.screen,.station{position:absolute;inset:0;display:none}
.screen.on,.station.on{display:block}
.L{font-family:'Lilita One',Nunito,sans-serif;font-weight:400}

/* buttons */
.btn{font-family:'Lilita One',Nunito,sans-serif;font-size:22px;color:#fff;background:linear-gradient(#ff5a5f,#d7262e);border:4px solid var(--ink);border-radius:16px;padding:8px 20px;box-shadow:0 5px 0 var(--ink);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:.5px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.green{background:linear-gradient(#86e060,#3fa52b)}
.btn.blue{background:linear-gradient(#5fb6ff,#1e78d2)}
.btn.gold{background:linear-gradient(#ffe066,#f2a900);color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.5)}
.btn.small{font-size:17px;padding:5px 12px;border-radius:12px}
.btn.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* store backdrop */
.store{position:absolute;inset:0;background:linear-gradient(#fbe6c2 0 61%,#8a6d45 61% 62%,transparent 62%),repeating-conic-gradient(#e6d6bb 0 25%,#f8f0e2 0 50%) 0 0/48px 48px}
.store.dim::after{content:"";position:absolute;inset:0;background:rgba(255,246,230,.35)}
.shelves{position:absolute;inset:0;opacity:.85}
.shelf{position:absolute;top:92px;width:224px;height:250px;background:#d8c09a;border:4px solid var(--ink);border-radius:8px;display:flex;flex-direction:column;justify-content:space-around;padding:4px 6px}
.srow{display:flex;align-items:flex-end;gap:3px;border-bottom:7px solid #8a6d45;height:72px;padding:0 3px;overflow:hidden}
.srow b{display:block;border:2px solid rgba(58,36,20,.7);border-radius:3px;flex:none}
.sign{position:absolute;left:376px;top:30px;width:210px;height:56px;background:var(--red);border:4px solid var(--ink);border-radius:14px;color:#fff;font:400 38px/48px 'Lilita One';text-align:center;box-shadow:0 5px 0 var(--ink);text-shadow:0 3px 0 #8e1016}
.lane{position:absolute;left:640px;top:40px;width:54px;height:54px;border-radius:50%;background:#ffe066;border:4px solid var(--ink);font:400 30px/46px 'Lilita One';text-align:center;box-shadow:0 0 18px #ffe066}
.lanepole{position:absolute;left:664px;top:92px;width:8px;height:80px;background:#777;border:2px solid var(--ink)}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:38px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:0 12px;z-index:60;font-weight:900;font-size:15px}
#hud .pill{background:#5a3a22;border-radius:12px;padding:3px 10px;display:flex;align-items:center;gap:6px}
#hDay{font-family:'Lilita One';font-size:19px;color:var(--gold)}
#hRank{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);text-align:center;font:400 16px/24px 'Lilita One'}
.xp{width:90px;height:10px;background:#2a1810;border-radius:6px;overflow:hidden;border:1px solid #8a6d45}
#hXp{height:100%;background:linear-gradient(90deg,#86e060,#3fa52b);width:0}
#hRankName{font-size:12px;color:#f3d9b8}
#hud .sp{flex:1}
#muteBtn{background:none;border:0;font-size:18px;cursor:pointer;color:#fff}

/* station bar */
#bar{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--ink);display:flex;gap:10px;align-items:flex-end;justify-content:center;z-index:60;padding:0 10px}
.tab{position:relative;width:170px;height:40px;border:4px solid #1c0f08;border-bottom:0;border-radius:14px 14px 0 0;background:#8a6d45;color:#fff;font:400 20px 'Lilita One';cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.tab.on{background:var(--gold);color:var(--ink);text-shadow:none;height:44px}
.tab .dot{position:absolute;top:-10px;right:-8px;width:24px;height:24px;border-radius:50%;background:#ff2d2d;border:3px solid #fff;color:#fff;font:400 15px/18px 'Lilita One';display:none;animation:pulse .8s infinite}
.tab.alert .dot{display:block}

/* people */
.ppl{width:100%;height:100%;overflow:visible}
.cust .fig{position:absolute;inset:0}
.pbar{position:absolute;left:30px;top:-6px;width:90px;height:22px;background:#fff;border:3px solid var(--ink);border-radius:11px;overflow:hidden;z-index:2;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:#4caf50;transition:width .25s linear,background .25s}
.pbar span{position:absolute;inset:0;text-align:center;font:400 14px/16px 'Lilita One';color:var(--ink);text-shadow:0 0 3px #fff}
.pbar.low{animation:pulse .5s infinite}
.cust.active .pbar{display:none}
.cust.leave{left:-220px!important;opacity:0;transition:left 1.4s ease-in,opacity 1.4s}
.huff{position:absolute;left:40px;top:-44px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 8px;font:400 16px 'Lilita One';color:#c62828;white-space:nowrap;animation:pop .2s}
#hLine{display:flex;gap:3px}
#hLine b{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:2px solid #fff;font-size:14px;position:relative}
#hLine b.low{animation:pulse .5s infinite}
#hStrikes{letter-spacing:1px}
.cust{position:absolute;width:150px;height:225px;transform-origin:50% 100%;transition:left 1s ease-in-out,top 1s,transform 1s,opacity .5s}
.cust.walk{animation:bob .3s infinite alternate}
@keyframes bob{to{margin-top:-6px}}
.nat{position:absolute;pointer-events:none}

/* order station */
.counter{position:absolute;left:130px;top:398px;width:590px;height:160px;background:linear-gradient(#f6f6f6 0 16px,#b9c2cc 16px 22px,#d7262e 22px 70px,#a81b22 70px);border:4px solid var(--ink);border-radius:10px 10px 0 0;z-index:30}
.cbelt{position:absolute;left:8px;top:2px;width:230px;height:12px;background:repeating-linear-gradient(90deg,#333 0 10px,#555 10px 20px);border-radius:6px;border:2px solid var(--ink)}
.register{position:absolute;left:395px;top:322px;width:78px;height:80px;z-index:31}
.register .scr{position:absolute;left:10px;top:0;width:58px;height:34px;background:#2b3a42;border:4px solid var(--ink);border-radius:6px;color:#7dff8a;font:900 14px/26px monospace;text-align:center}
.register .bx{position:absolute;left:0;top:36px;width:78px;height:44px;background:#9aa6b2;border:4px solid var(--ink);border-radius:8px}
#takeBtn{position:absolute;left:236px;top:150px;z-index:35;display:none}
#bubble{position:absolute;left:18px;top:46px;width:330px;min-height:70px;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:10px 12px;z-index:40;display:none;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#bubble::after{content:"";position:absolute;left:250px;bottom:-22px;border:12px solid transparent;border-top:14px solid var(--ink)}
#bubble .nm{font:400 18px 'Lilita One';color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border:3px solid var(--ink);border-radius:9px;font-size:20px;animation:pop .2s}
.reqline{font-weight:900;font-size:14px;margin-top:5px;animation:pop .2s}
#rail{position:absolute;left:738px;top:46px;width:214px;height:110px;z-index:20}
#rail .rl{font:400 13px 'Lilita One';color:#fff;background:var(--ink);display:inline-block;padding:1px 8px;border-radius:6px 6px 0 0}
#railT{display:flex;gap:4px;background:#8a6d45;border:3px solid var(--ink);padding:5px;border-radius:0 8px 8px 8px;min-height:74px;overflow:hidden}
.mini{flex:none;width:62px;height:62px;background:#fff;border:2px solid var(--ink);border-top:6px solid var(--red);border-radius:4px;font-size:10px;font-weight:900;text-align:center;padding:2px;line-height:1.2;animation:pop .3s}
.mini b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini.act{border-top-color:#3fa52b;background:#eaffdf}

/* sort station */
#belt{position:absolute;left:20px;top:44px;width:670px;height:136px;background:#2b2b2b;border:5px solid var(--ink);border-radius:12px;overflow:hidden}
#belt .bs{position:absolute;inset:6px 0;background:repeating-linear-gradient(90deg,#3c3c3c 0 22px,#2f2f2f 22px 44px);animation:beltmv 1s linear infinite;animation-play-state:paused}
#belt.run .bs{animation-play-state:running}
@keyframes beltmv{to{background-position:44px 0}}
#belt .rail{position:absolute;left:0;right:0;height:7px;background:#b9c2cc}
.chute{position:absolute;left:4px;top:28px;width:34px;height:120px;background:#9aa6b2;border:4px solid var(--ink);border-radius:8px;z-index:3}
.bend{position:absolute;left:680px;top:48px;width:30px;height:128px;background:repeating-linear-gradient(45deg,#ffd000 0 10px,#222 10px 20px);border:4px solid var(--ink);border-radius:6px;opacity:.9}
.bendlbl{position:absolute;left:574px;top:50px;z-index:4;font:900 11px Nunito;color:#a81b22;background:#fff3c4;padding:1px 6px;border:2px solid var(--ink);border-radius:6px}
.hold{position:absolute;border:4px dashed #8a6d45;border-radius:14px;background:rgba(255,255,255,.45)}
.hold span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:400 13px 'Lilita One';color:#8a6d45}
#cartsvg{position:absolute;left:0;top:0;pointer-events:none}
#ticket{position:absolute;left:722px;top:44px;width:228px;min-height:150px;background:#fff;border:4px solid var(--ink);border-top:12px solid var(--red);border-radius:6px;padding:6px 8px;z-index:12;font-size:12px;box-shadow:0 4px 0 rgba(0,0,0,.2);display:none}
#ticket h3{margin:0;font:400 18px 'Lilita One'}
#ticket .tk-items{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
#ticket .ti{border:2px solid var(--ink);border-radius:6px;padding:0 4px;font-weight:900;font-size:12px;background:#f7f0e3}
#ticket .ti.done{background:#c9f2b4}
#ticket .ti.bad{background:#ffb4b4}
#ticket ul{list-style:none;margin:4px 0 0;padding:0}
#ticket li{font-weight:900;padding:2px 0 2px 20px;position:relative;line-height:1.2}
#ticket li::before{content:"☐";position:absolute;left:2px;top:1px}
#ticket li.ok{color:#2e7d32}
#ticket li.ok::before{content:"✅";font-size:11px}
#ticket .leg{margin-top:5px;border-top:2px dashed #ccc;padding-top:4px;font-size:10.5px;font-weight:800;color:#6b5040}
#ticket .warn{color:#c62828;font-weight:900}
#rotBtn{position:absolute;left:606px;top:402px;z-index:13}
#serveBtn{position:absolute;left:600px;top:452px;z-index:13;font-size:24px}
#ghost{position:absolute;border:3px dashed #2e7d32;background:rgba(76,175,80,.28);border-radius:9px;pointer-events:none;display:none;z-index:14}
#ghost.bad{border-color:#c62828;background:rgba(244,67,54,.25)}
#ghost.warn{border-color:#ef6c00;background:rgba(255,152,0,.35)}
#pcs{position:absolute;inset:0;pointer-events:none;z-index:15}
#pcs .pc{pointer-events:auto}
#toast{position:absolute;left:180px;top:192px;width:420px;text-align:center;z-index:30;pointer-events:none}
#toast div{display:inline-block;background:var(--ink);color:#fff;font:900 15px Nunito;padding:6px 14px;border-radius:12px;animation:toast 2s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#startPanel{position:absolute;left:170px;top:220px;width:400px;background:var(--cream);border:5px solid var(--ink);border-radius:20px;padding:18px;text-align:center;z-index:25;box-shadow:0 6px 0 var(--ink);display:none}
#startPanel h2{margin:0 0 6px;font:400 28px 'Lilita One';color:var(--red)}
#hint{position:absolute;left:170px;top:186px;font:800 12px Nunito;color:#6b5040}

/* pieces */
.pc{position:absolute;border:3px solid var(--ink);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;box-shadow:inset 0 -5px 0 rgba(0,0,0,.13),inset 0 3px 0 rgba(255,255,255,.55);touch-action:none}
.pc .em{font-size:28px;line-height:1;pointer-events:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.pc.s1 .em{font-size:23px}
.pc .lbl{font:900 9.5px Nunito;text-transform:uppercase;margin-top:2px;pointer-events:none;white-space:nowrap}
.pc.s1 .lbl{display:none}
.pc .bdg{position:absolute;top:-8px;right:-6px;display:flex;gap:1px;pointer-events:none}
.pc .bdg i{font-style:normal;width:17px;height:17px;border-radius:50%;border:2px solid var(--ink);font:900 10px/13px Nunito;text-align:center;color:#fff}
.hv{background:#7b1f1f}.fr{background:#ff9800}.cd{background:#2f8be6}
.pc.drag{z-index:50;cursor:grabbing;transform:scale(1.07);box-shadow:0 14px 18px rgba(0,0,0,.35)}
.pc.anim{transition:top .14s cubic-bezier(.5,0,1,1),left .1s}
.pc.teeter{animation:teeter .2s infinite alternate}
@keyframes teeter{from{transform:rotate(-5deg)}to{transform:rotate(9deg) translateX(5px)}}
.pc.fall{transition:transform .7s cubic-bezier(.5,0,1,1),opacity .7s;transform:translate(60px,420px) rotate(130deg);opacity:0;pointer-events:none}
.pc.splat{background:#8d7b6a!important;filter:saturate(.4);cursor:not-allowed}
.pc.splat .em{transform:scale(1.15)}
.pc.squish{animation:squish .45s infinite alternate}
@keyframes squish{to{box-shadow:0 0 0 5px #ff2d2d,inset 0 -5px 0 rgba(0,0,0,.13)}}
.pc.pop{animation:pop .25s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.pc.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* serve station */
#svCust{position:absolute;left:30px;top:150px;width:230px;height:345px}
#svBubble{position:absolute;left:20px;top:56px;width:270px;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:10px 12px;font:900 16px Nunito;z-index:3}
#svBubble::after{content:"";position:absolute;left:120px;bottom:-22px;border:12px solid transparent;border-top:14px solid var(--ink)}
#svCart{position:absolute;left:290px;top:130px;width:330px;height:300px}
#svCard{position:absolute;left:630px;top:52px;width:310px;height:450px;background:#fff;border:5px solid var(--ink);border-top:16px solid var(--red);border-radius:10px;padding:10px 16px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#svCard h2{margin:0;font:400 24px 'Lilita One';text-align:center}
.sbar{margin:10px 0}
.sbar .t{display:flex;justify-content:space-between;font-weight:900;font-size:15px}
.sbar .tr{height:18px;border:3px solid var(--ink);border-radius:10px;background:#eee;overflow:hidden}
.sbar .f{height:100%;width:0;transition:width .7s ease-out}
.total{text-align:center;margin-top:8px}
.total .pct{font:400 46px 'Lilita One';line-height:1}
.total .gr{font:400 24px 'Lilita One';color:var(--red)}
.total .tip{font-weight:900;font-size:16px;margin-top:4px}
#svCont{position:absolute;left:340px;top:470px}

/* modal */
#modal{position:absolute;inset:0;background:rgba(42,24,16,.6);display:none;align-items:center;justify-content:center;z-index:100}
#modal.on{display:flex}
.card{width:560px;max-height:540px;overflow:auto;background:var(--cream);border:6px solid var(--ink);border-radius:24px;padding:20px 26px;text-align:center;box-shadow:0 8px 0 var(--ink);animation:pop .3s}
.card h1{margin:0;font:400 44px 'Lilita One';color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}
.card h2{margin:4px 0 10px;font:400 24px 'Lilita One'}
.card ul{text-align:left;font-weight:800;font-size:15px;line-height:1.5;padding-left:22px}
.card .row{display:flex;justify-content:space-between;font-weight:900;font-size:16px;border-bottom:2px dashed #d9c3a0;padding:4px 0}
.card .btns{margin-top:14px;display:flex;gap:12px;justify-content:center}

/* title */
#title{background:repeating-conic-gradient(from 0deg at 50% 70%,#d7262e 0 9deg,#ea4a50 9deg 18deg)}
#title .logo{position:absolute;left:330px;top:50px;width:600px;text-align:center;transform:rotate(-3deg)}
#title .l1{font:400 52px 'Lilita One';color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:0 5px 0 var(--ink)}
#title .l2{font:400 46px 'Lilita One';color:var(--gold);-webkit-text-stroke:3px var(--ink);text-shadow:0 5px 0 var(--ink);margin-top:-6px}
#title .l3{font:400 92px 'Lilita One';color:#fff;-webkit-text-stroke:4px var(--ink);text-shadow:0 7px 0 var(--ink);margin-top:-14px;letter-spacing:2px}
#title .l3 span{color:#7fe05a}
#title .tag{display:inline-block;background:var(--ink);color:#fff;font-weight:900;padding:4px 14px;border-radius:12px;margin-top:4px}
#titleNat{position:absolute;left:30px;top:120px;width:300px;height:450px}
#titleBtns{position:absolute;left:400px;top:380px;width:460px;display:flex;flex-direction:column;gap:12px;align-items:center}
#titleBtns .btn{width:280px;font-size:28px}
#titleCart{position:absolute;left:250px;top:418px;font-size:60px;filter:drop-shadow(0 4px 0 var(--ink))}
</style>
</head>
<body>
<div id="stage">
  <div id="title" class="screen on">
    <div id="titleNat"></div>
    <div class="logo">
      <div class="l1">Natalie</div>
      <div class="l2">Shopping Cart</div>
      <div class="l3">SORT<span>ERIA</span></div>
      <div class="tag">🛒 Big Y Checkout Lane 3</div>
    </div>
    <div id="titleBtns"></div>
  </div>

  <div id="game" class="screen">
    <div id="hud">
      <span id="hDay">Day 1</span>
      <span class="pill">👥 <span id="hServed">0/0</span></span>
      <span class="pill" title="Customers who walk out — 3 and the day is over">Walkouts <span id="hStrikes"></span></span>
      <span id="hLine" title="Patience of customers in line"></span>
      <span class="pill">⏱ <span id="hClock">9:00 AM</span></span>
      <span class="sp"></span>
      <span class="pill"><span id="hRank">1</span><span><span id="hRankName"></span><div class="xp"><div id="hXp"></div></div></span></span>
      <span class="pill">💵 <span id="hTips">$0.00</span></span>
      <button id="muteBtn" title="Sound">🔊</button>
    </div>

    <div id="order" class="station">
      <div class="store"></div><div class="shelves" id="shelvesO"></div>
      <div class="sign">BIG Y</div><div class="lanepole"></div><div class="lane">3</div>
      <div id="rail"><span class="rl">ORDER TICKETS</span><div id="railT"></div></div>
      <div id="olayer"></div>
      <div id="natO" class="nat" style="left:478px;top:196px;width:165px;height:248px"></div>
      <div class="counter"><div class="cbelt"></div></div>
      <div class="register"><div class="scr" id="regScr">$0.00</div><div class="bx"></div></div>
      <button id="takeBtn" class="btn green pulse">Take Order!</button>
      <div id="bubble"></div>
    </div>

    <div id="sort" class="station">
      <div class="store dim"></div><div class="shelves" id="shelvesS" style="opacity:.35"></div>
      <div id="belt"><div class="rail" style="top:0"></div><div class="bs"></div><div class="rail" style="bottom:0"></div></div>
      <div class="chute"></div>
      <div class="bend"></div><div class="bendlbl">⚠ NO STOPPER!</div>
      <div class="hold" style="left:14px;top:196px;width:142px;height:140px"><span>COUNTER</span></div>
      <div class="hold" style="left:14px;top:346px;width:142px;height:140px"><span>COUNTER</span></div>
      <div id="hint">Drag groceries into the cart · tap an item or press R to rotate</div>
      <svg id="cartsvg" width="960" height="600"></svg>
      <div id="natS" class="nat" style="left:736px;top:236px;width:214px;height:321px"></div>
      <div id="ticket"></div>
      <button id="rotBtn" class="btn small blue">⟳ Rotate</button>
      <button id="serveBtn" class="btn green">Serve ✔</button>
      <div id="ghost"></div>
      <div id="pcs"></div>
      <div id="startPanel"></div>
      <div id="toast"></div>
    </div>

    <div id="serve" class="station">
      <div class="store"></div><div class="shelves" id="shelvesV" style="opacity:.5"></div>
      <div id="svBubble"></div>
      <div id="svCust"></div>
      <div id="svCart"></div>
      <div id="svCard"></div>

/* ---------- grid helpers ---------- */
function landRow(grid,cols,rows,c,w,h){let floor=rows;for(let x=c;x<c+w;x++)for(let y=0;y<rows;y++)if(grid[y*cols+x]!=null){if(y<floor)floor=y;break}return floor-h}
function stamp(grid,cols,id,c,r,w,h){for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)grid[y*cols+x]=id}
function unstamp(grid,id){for(let i=0;i<grid.length;i++)if(grid[i]===id)grid[i]=null}
function anyBelow(grid,cols,rows,c,startRow,w,test){for(let x=c;x<c+w;x++)for(let y=startRow;y<rows;y++){const id=grid[y*cols+x];if(id!=null&&test(id))return true}return false}

/* ---------- order generation (always packable) ---------- */
function genOrder(d,rank,def){
  const D=diff(d),cols=D.cols,rows=D.rows,pool=Object.keys(ITEMS).filter(k=>(ITEMS[k].r||1)<=rank);
  const grid=new Array(cols*rows).fill(null),info=[];
  const target=Math.min(Math.round(cols*rows*D.fill*def.size*(.92+Math.random()*.16)),Math.floor(cols*rows*.9));
  let filled=0,tries=0;
  while(filled<target&&tries++<600){
    const k=pick(pool),it=ITEMS[k];let w=it.w,h=it.h;if(w!==h&&Math.random()<.35)[w,h]=[h,w];
    if(filled+w*h>target+1)continue;
    let best=[],bestR=-1;
    for(let c=0;c<=cols-w;c++){const r=landRow(grid,cols,rows,c,w,h);if(r<0)continue;
      if(it.heavy&&anyBelow(grid,cols,rows,c,r+h,w,id=>info[id].fragile))continue;
      if(r>bestR){bestR=r;best=[c]}else if(r===bestR)best.push(c)}
    if(!best.length)continue;
    const c=pick(best);info.push({k,fragile:!!it.fragile});stamp(grid,cols,info.length-1,c,bestR,w,h);filled+=w*h;
  }
  const keys=info.map(i=>i.k),reqs=[],seatKeys=[];
  const n=D.reqMax?rint(Math.max(1,D.reqMax-1),D.reqMax):0;
  for(const t of shuffle(['seat','top','bottom','cold'])){
    if(reqs.length>=n)break;
    if(t==='seat'){const k=pick(pool.filter(k=>!ITEMS[k].heavy));seatKeys.push(k);reqs.push({t,k})}
    if(t==='top'){const f=keys.filter(k=>ITEMS[k].fragile);if(f.length)reqs.push({t,k:pick(f)})}
    if(t==='bottom'){const f=keys.filter(k=>ITEMS[k].heavy);if(f.length)reqs.push({t,k:pick(f)})}
    if(t==='cold'&&[...keys,...seatKeys].filter(k=>ITEMS[k].cold).length>=2)reqs.push({t});
  }
  return{items:shuffle([...keys,...seatKeys]),reqs,cols,rows};
}
function reqText(q){const it=ITEMS[q.k]||{};return{seat:`${it.e} ${it.n} in the KID SEAT`,top:`${it.e} ${it.n} on TOP (nothing above it)`,bottom:`${it.e} ${it.n} on the BOTTOM`,cold:`❄ Keep cold items TOUCHING`}[q.t]}
function reqSay(q){const it=ITEMS[q.k]||{};return{seat:`Put my ${it.n.toLowerCase()} in the kid seat!`,top:`Keep my ${it.n.toLowerCase()} on top, please!`,bottom:`${it.n} goes on the bottom.`,cold:`Keep my cold stuff together!`}[q.t]}

function tickPatience(){
  for(const c of [...G.queue,...G.waiting]){
    c.el.classList.toggle('active',frozen(c));if(frozen(c))continue;
    const f=(G.t-c.arrive)/c.patience,left=Math.max(0,Math.ceil(c.patience-(G.t-c.arrive))),bar=c.el.querySelector('.pbar');
    bar.querySelector('i').style.width=Math.max(0,100-f*100)+'%';bar.querySelector('i').style.background=f<.5?'#4caf50':f<.75?'#ffc107':'#f44336';
    bar.querySelector('span').textContent=left+'s';bar.classList.toggle('low',f>=.8);

function tickBelt(dt){
  if(S.toSpawn.length){const minX=S.belt.length?Math.min(...S.belt.map(id=>S.pcs[id].x)):1e9;if(minX>=S.gap){const p=makePiece(S.toSpawn.shift());S.belt.push(p.id);posPiece(p)}}
  const arr=S.belt.map(id=>S.pcs[id]).sort((a,b)=>b.x-a.x);let lim=BW-4,worried=false;
  arr.forEach((p,i)=>{const w=p.w*CELL;p.x=Math.min(p.x+S.speed*dt,lim-w);

    else if(p.teeter){p.teeter=0;p.el.classList.remove('teeter')}

function clearAbove(p){const g=p.where==='cart'?S.grid:S.seat,cols=p.where==='cart'?S.cols:SEATC;for(let x=p.col;x<p.col+p.w;x++)for(let y=0;y<p.row;y++)if(g[y*cols+x]!=null)return false;return true}
function beginDrag(){

  drag.origin={where:p.where,x:p.x,col:p.col,row:p.row,slot:p.slot,w:p.w,h:p.h};
  if(p.where==='belt'){S.belt=S.belt.filter(id=>id!==p.id);p.teeter=0;p.el.classList.remove('teeter')}

  p.where='drag';p.el.classList.add('drag');SFX.pick();updateLive();return drag.started=true;
}
function rotateDrag(){const p=drag.p;if(p.w===p.h)return;[p.w,p.h]=[p.h,p.w];sizePiece(p);drag.ox=p.w*CELL/2;drag.oy=p.h*CELL/2;SFX.blip();moveDrag()}
function rotateInPlace(p){if(p.w===p.h)return;[p.w,p.h]=[p.h,p.w];sizePiece(p);posPiece(p);SFX.blip()}
function moveDrag(){
  const p=drag.p,left=drag.lx-drag.ox,top=drag.ly-drag.oy;setXY(p,left,top);
  const t=drag.target=computeTarget(p,left,top),g=$('#ghost');
  if(!t||t.kind==='hold'){g.style.display='none';return}
  const gx=(t.kind==='cart'?CART_X:SEAT_X)+t.c*CELL,gy=(t.kind==='cart'?CART_Y:SEAT_Y)+Math.max(0,t.r)*CELL;
  g.style.display='block';g.style.left=gx+'px';g.style.top=gy+'px';g.style.width=p.w*CELL+'px';g.style.height=p.h*CELL+'px';
  g.className=!t.ok?'bad':(t.squish&&S.hints)?'warn':'';
}
function computeTarget(p,left,top){
  const cx=left+p.w*CELL/2,cy=top+p.h*CELL/2;
  for(let i=0;i<2;i++){const h=HOLDS[i];if(!S.hold[i]&&cx>h.x&&cx<h.x+h.w&&cy>h.y&&cy<h.y+h.h)return{kind:'hold',i}}
  const mainR=CART_X+S.cols*CELL;
  if(cx>=mainR+9&&cx<=SEAT_X+SEATC*CELL+40&&cy>=SEAT_Y-120&&cy<=SEAT_Y+SEATR*CELL+50){
    if(p.w>SEATC)return{kind:'seat',c:0,r:-1,ok:false,why:'Too big for the kid seat!'};
    const c=clamp(Math.round((left-SEAT_X)/CELL),0,SEATC-p.w),r=landRow(S.seat,SEATC,SEATR,c,p.w,p.h);
    return{kind:'seat',c,r,ok:r>=0&&!p.heavy,why:p.heavy?'Too heavy for the kid seat!':'No room there!'}}
  if(cx>=CART_X-40&&cx<mainR+9&&cy>=CART_Y-140&&cy<=CART_Y+S.rows*CELL+50){
    const c=clamp(Math.round((left-CART_X)/CELL),0,S.cols-p.w),r=landRow(S.grid,S.cols,S.rows,c,p.w,p.h);
    const squish=r>=0&&p.heavy&&anyBelow(S.grid,S.cols,S.rows,c,r+p.h,p.w,id=>S.pcs[id].fragile);
    return{kind:'cart',c,r,ok:r>=0,squish,why:"It won't fit there!"}}
  return null;
}
function endDrag(){
  const d=drag;drag=null;const p=d.p,t=d.target;$('#ghost').style.display='none';p.el.classList.remove('drag');
  if(t&&t.kind==='hold'){p.where='hold';p.slot=t.i;S.hold[t.i]=p.id;posPiece(p);SFX.place()}
  else if(t&&t.ok){p.where=t.kind;p.col=t.c;p.row=t.r;stamp(t.kind==='cart'?S.grid:S.seat,t.kind==='cart'?S.cols:SEATC,p.id,t.c,t.r,p.w,p.h);
    p.el.classList.add('anim');requestAnimationFrame(()=>posPiece(p));setTimeout(()=>p.el.classList.remove('anim'),200);SFX.place();
    if(p.heavy)squashBelow(p)}
  else{if(t&&t.why){toast(t.why);SFX.bad()}
    const o=d.origin;p.where=o.where;
    if(o.where==='belt'){p.x=Math.max(0,o.x);S.belt.push(p.id)}
    else if(o.where==='hold'){if(p.w*CELL>130||p.h*CELL>130){[p.w,p.h]=[o.w,o.h]}S.hold[o.slot]=p.id}
    else{[p.w,p.h]=[o.w,o.h];p.col=o.col;p.row=o.row;stamp(o.where==='cart'?S.grid:S.seat,o.where==='cart'?S.cols:SEATC,p.id,o.col,o.row,p.w,p.h)}
    sizePiece(p);posPiece(p)}
  updateLive();
}

/* live checks */
function placed(){return Object.values(S.pcs).filter(p=>(p.where==='cart'||p.where==='seat')&&!p.squashed)}
function squashBelow(h){const g=h.where==='cart'?S.grid:S.seat,cols=h.where==='cart'?S.cols:SEATC,rows=h.where==='cart'?S.rows:SEATR,hit=new Set();
  for(let x=h.col;x<h.col+h.w;x++)for(let y=h.row+h.h;y<rows;y++){const id=g[y*cols+x];if(id!=null&&S.pcs[id].fragile&&!S.pcs[id].squashed)hit.add(id)}
  hit.forEach(id=>{const p=S.pcs[id];p.squashed=true;S.squashed.push(p.k);p.el.classList.add('splat');p.el.innerHTML=`<span class="em">💥</span><span class="lbl">squashed</span>`});
  if(hit.size){const n=[...hit].map(id=>ITEMS[S.pcs[id].k].n).join(' & ');toast(`CRUNCH! The ${n} got squashed — lost!`);SFX.drop();setNatMood('sad');natTimer=1.6}}
function isSquished(p){if(!p.fragile||(p.where!=='cart'&&p.where!=='seat'))return false;const g=p.where==='cart'?S.grid:S.seat,cols=p.where==='cart'?S.cols:SEATC;
  for(let x=p.col;x<p.col+p.w;x++)for(let y=0;y<p.row;y++){const id=g[y*cols+x];if(id!=null&&S.pcs[id].heavy)return true}return false}
function coldOK(){const all=Object.values(S.pcs).filter(p=>p.cold),need=S.cust.order.items.filter(k=>ITEMS[k].cold).length;
  if(all.length<need||all.some(p=>p.squashed||(p.where!=='cart'&&p.where!=='seat')))return false;if(all.length<2)return true;
  const wh=all[0].where;if(all.some(p=>p.where!==wh))return false;
  const g=wh==='cart'?S.grid:S.seat,cols=wh==='cart'?S.cols:SEATC,cells=new Set();g.forEach((id,i)=>{if(id!=null&&S.pcs[id].cold)cells.add(i)});
  const st=[cells.values().next().value],seen=new Set(st);while(st.length){const i=st.pop(),x=i%cols;for(const j of [i-cols,i+cols,x>0?i-1:-1,x<cols-1?i+1:-1])if(j>=0&&cells.has(j)&&!seen.has(j)){seen.add(j);st.push(j)}}
  return seen.size===cells.size}
function reqOK(q){const ps=placed().filter(p=>p.k===q.k);
  if(q.t==='seat')return ps.some(p=>p.where==='seat');if(q.t==='top')return ps.some(clearAbove);
  if(q.t==='bottom')return ps.some(p=>p.where==='cart'&&p.row+p.h===S.rows);return coldOK()}
function renderTicket(){const c=S.cust;
  $('#ticket').innerHTML=`<h3>${c.def.name}'s Order</h3><div class="tk-items" id="tkItems"></div>${c.order.reqs.length?'<b>Special requests:</b>':'<i>No special requests</i>'}<ul>${c.order.reqs.map((q,i)=>`<li id="rq${i}">${reqText(q)}</li>`).join('')}</ul><div id="tkWarn" class="warn"></div><div class="leg"><i class="hv" style="font-style:normal;color:#fff;padding:0 4px;border-radius:6px">⬇</i> heavy · <i class="fr" style="font-style:normal;color:#fff;padding:0 5px;border-radius:6px">!</i> fragile · <i class="cd" style="font-style:normal;color:#fff;padding:0 3px;border-radius:6px">❄</i> cold<br>Heavy above fragile = SQUASHED &amp; lost</div>`;updateLive()}
function updateLive(){
  if(!S)return;const ps=placed(),c=S.cust,counts={};
  c.order.items.forEach(k=>{counts[k]=counts[k]||{t:0,p:0,d:0};counts[k].t++});ps.forEach(p=>counts[p.k].p++);S.dropped.forEach(k=>counts[k].d++);S.squashed.forEach(k=>counts[k].d++);
  $('#tkItems').innerHTML=Object.entries(counts).map(([k,v])=>`<span class="ti ${v.p===v.t?'done':v.d?'bad':''}">${ITEMS[k].e} ${v.p}/${v.t}</span>`).join('');
  c.order.reqs.forEach((q,i)=>$('#rq'+i).classList.toggle('ok',reqOK(q)));
  const sq=S.squashed.length,dr=S.dropped.length;
  $('#tkWarn').textContent=[sq?`💥 ${sq} squashed`:'',dr?`🫳 ${dr} dropped`:''].filter(Boolean).join(' · ')+(sq||dr?' — lost!':'');
  const wasDone=S.done;S.done=!S.toSpawn.length&&!S.belt.length&&!S.hold[0]&&!S.hold[1]&&!drag;
  $('#serveBtn').classList.toggle('pulse',S.done);
  if(S.done&&!wasDone){toast('All sorted! Hit Serve ✔');SFX.ding()}
}
$('#serveBtn').onclick=()=>{if(!S||!S.running||drag)return;
  if(!S.done&&!S.confirm){S.confirm=1;$('#serveBtn').textContent='Serve anyway?';setTimeout(()=>{if(S){S.confirm=0;$('#serveBtn').textContent='Serve ✔'}},2500);return}
  serve()};

/* ---------- scoring & serve ---------- */
function serve(){
  const c=S.cust,N=c.order.items.length,ps=placed();
  const drops=S.dropped.length,packing=Math.max(0,Math.round(100*ps.length/N)-15*drops);
  const sq=S.squashed.map(k=>({k})),stacking=ps.length||sq.length?Math.max(0,100-40*sq.length):0;
  const reqs=c.order.reqs,okN=reqs.filter(reqOK).length,requests=reqs.length?Math.round(100*okN/reqs.length):100;
  const w=G.t-c.arrive,waiting=w<=c.est?100:Math.max(0,Math.round(100-(w-c.est)/c.est*95));
  const total=Math.round((packing+stacking+requests+waiting)/4);
  const tip=+((((total/100)**2)*(1.5+N*.35)*(1+.06*(G.day-1))+(total>=100?1:0))*Math.max(0,1-.2*drops)).toFixed(2);
  const pts=total+(total>=100?25:0);
  const missing=c.order.items.slice();ps.forEach(p=>{const i=missing.indexOf(p.k);if(i>=0)missing.splice(i,1)});
  const snap={cols:S.cols,rows:S.rows,pcs:Object.values(S.pcs).filter(p=>p.where==='cart'||p.where==='seat').map(p=>({k:p.k,w:p.w,h:p.h,col:p.col,row:p.row,where:p.where,sq:!!p.squashed}))};
  Object.values(S.pcs).forEach(p=>p.el.remove());S.running=false;$('#belt').classList.remove('run');
  save.points+=pts;save.tips=+(save.tips+tip).toFixed(2);G.dayTips+=tip;G.dayPoints+=pts;writeSave();
  const res={c,packing,stacking,requests,waiting,total,tip,pts,sq:sq.map(p=>p.k),missing,dropped:S.dropped.slice(),failedReqs:reqs.filter(q=>!reqOK(q))};
  G.results.push(res);S=null;G.paused=true;showServe(res,snap);
}
function grade(t){return t>=100?'PERFECT!':t>=90?'Awesome!':t>=75?'Great!':t>=60?'Good':t>=40?'Okay...':'Yikes!'}
function showServe(r,snap){
  showStation('serve');const mood=r.total>=90?'happy':r.total>=70?'smile':r.total>=50?'neutral':r.total>=30?'sad':'angry';
  $('#svCust').innerHTML=person(r.c.def,mood);
  let line=r.total>=95?pick(['PERFECT fit! You\'re a sorting genius!','Wow, not one squished thing!','Best checkout in Connecticut!']):r.total>=80?pick(['Great job, Natalie!','Nicely packed!','Now that\'s a tidy cart!']):'';
  if(r.total<95){if(r.sq.length)line=`My ${ITEMS[r.sq[0]].n.toLowerCase()} got SQUASHED!`;else if(r.dropped.length)line=`You dropped my ${ITEMS[r.dropped[0]].n.toLowerCase()}!`;else if(r.missing.length)line=`Where's my ${ITEMS[r.missing[0]].n.toLowerCase()}?`;else if(r.failedReqs.length)line=`I asked for: ${reqText(r.failedReqs[0])}...`;else if(r.waiting<70)line='That took forever...';else line=line||'Thanks!'}
  $('#svBubble').textContent=line;
  const m=.62,C=CELL*m,ox=0,oy=300-snap.rows*C-30,sx=snap.cols*C+16,sy=oy-22*m-10;let h=`<div style="position:absolute;left:${ox-4}px;top:${oy-4}px;width:${snap.cols*C+8}px;height:${snap.rows*C+8}px;border:5px solid #5b6773;border-radius:8px;background:#eef2f6"></div><div style="position:absolute;left:${sx-4}px;top:${sy-4}px;width:${SEATC*C+8}px;height:${SEATR*C+8}px;border:4px solid #c62828;border-radius:8px;background:#fff0f0"></div>`;
  snap.pcs.forEach(p=>{const it=ITEMS[p.k],x=(p.where==='cart'?ox:sx)+p.col*C,y=(p.where==='cart'?oy:sy)+p.row*C;
    h+=`<div style="position:absolute;left:${x+1}px;top:${y+1}px;width:${p.w*C-2}px;height:${p.h*C-2}px;background:${it.c};border:2px solid #3a2414;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:17px;${p.sq?'box-shadow:0 0 0 3px #ff2d2d':''}">${p.sq?'💥':it.e}</div>`});
  $('#svCart').innerHTML=h;
  const bar=(l,v,i)=>`<div class="sbar"><div class="t"><span>${l}</span><span>${v}%</span></div><div class="tr"><div class="f" data-v="${v}" style="background:${v>=80?'#4caf50':v>=50?'#ffc107':'#f44336'};transition-delay:${.2+i*.35}s"></div></div></div>`;
  $('#svCard').innerHTML=`<h2>${r.c.def.name}'s Rating</h2>${bar('⏱ Waiting',r.waiting,0)}${bar('🛒 Packing'+(r.dropped.length?` <small style="color:#c62828">(−${15*r.dropped.length} for drops)</small>`:''),r.packing,1)}${bar('🥚 No Squishing',r.stacking,2)}${bar('📝 Requests',r.requests,3)}<div class="total"><div class="pct">${r.total}%</div><div class="gr">${grade(r.total)}</div><div class="tip">💵 Tip: $${r.tip.toFixed(2)} &nbsp; ⭐ +${r.pts} pts</div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#svCard .f').forEach(f=>f.style.width=f.dataset.v+'%')));
  setTimeout(()=>{r.total>=60?SFX.cash():SFX.bad()},1700);
}
$('#svCont').onclick=()=>{
  const r=G.results[G.results.length-1],c=r.c;G.waiting=G.waiting.filter(x=>x!==c);c.el.remove();G.served++;G.paused=false;if(G.strikes>=3)return;
  layoutPeople();renderRail();
  const after=()=>{if(G.served+G.left>=G.total)daySummary();else showStation(G.tickets.length&&!G.queue.length?'sort':'order')};
  const r0=G.rank0,r1=rankOf(save.points);
  if(r1>r0){G.rank0=r1;G.paused=true;SFX.rank();const unl=Object.values(ITEMS).filter(it=>(it.r||1)>r0&&(it.r||1)<=r1);
    modal(`<h1>Rank Up!</h1><h2>Rank ${r1}: ${rankName(r1)}</h2>${unl.length?`<p style="font-weight:900">New groceries on the belt:</p><div class="chips" style="justify-content:center">${unl.map(it=>`<span class="chip" style="background:${it.c};padding:0 8px;font-size:15px;font-weight:900">${it.e} ${it.n}</span>`).join('')}</div>`:'<p style="font-weight:900">Customers will expect even more from you now!</p>'}`,[['Awesome!','gold',()=>{G.paused=false;after()}]]);
  }else after();
};
function daySummary(){
  G.paused=true;const avg=G.results.length?Math.round(G.results.reduce((a,r)=>a+r.total,0)/G.results.length):0;
  modal(`<h1>Day ${G.day} Done!</h1><h2>Average rating: ${avg}% — ${grade(avg)}</h2>${G.results.map(r=>`<div class="row"><span>${r.c.def.name}</span><span>${r.total}% · $${r.tip.toFixed(2)}</span></div>`).join('')}
  ${G.left?`<div class="row" style="color:#c62828"><span>Walked out 😤</span><span>${G.left}</span></div>`:''}<div class="row"><span>Tips today</span><span>$${G.dayTips.toFixed(2)}</span></div><div class="row"><span>Points today</span><span>+${G.dayPoints}</span></div><div class="row"><span>Rank</span><span>${rankOf(save.points)} · ${rankName(rankOf(save.points))}</span></div>`,
  [['Title','blue',()=>{save.day++;writeSave();showTitle()}],['Next Day ➜','green',()=>{save.day++;writeSave();startDay()}]]);
}

/* ---------- main loop ---------- */
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(G&&!G.paused){G.t+=dt;
    if(G.arrived<G.total){const idle=!G.queue.length&&!G.tickets.length&&!S&&!G.taking;if(idle&&G.nextArrive>G.t+2)G.nextArrive=G.t+2;
      if(G.t>=G.nextArrive){arrive();const D=diff(G.day);G.nextArrive=G.t+D.interval*(.75+Math.random()*.5)}}
    if(G.station==='sort'&&S&&S.running&&!$('#modal').classList.contains('on'))tickBelt(dt);
    acc+=dt;if(acc>.25){acc=0;hud();
      if(!G.paused)tickPatience()}}
  requestAnimationFrame(frame)}
function hud(){$('#hDay').textContent='Day '+G.day;$('#hServed').textContent=`${G.served}/${G.total}`;
  $('#hStrikes').textContent='😡'.repeat(G.strikes)+'⚪'.repeat(Math.max(0,3-G.strikes));
  $('#hLine').innerHTML=[...G.queue,...G.waiting].filter(c=>!frozen(c)).map(c=>{const f=(G.t-c.arrive)/c.patience;return`<b class="${f>=.8?'low':''}" title="${c.def.name}" style="background:${f<.5?'#4caf50':f<.75?'#ffc107':'#f44336'}">${f<.45?'🙂':f<.65?'😐':f<.82?'🙁':'😡'}</b>`}).join('');
  const r=rankOf(save.points),lo=need(r),hi=need(r+1);$('#hRank').textContent=r;$('#hRankName').textContent=rankName(r);$('#hXp').style.width=Math.min(100,(save.points-lo)/(hi-lo)*100)+'%';
  $('#hTips').textContent='$'+save.tips.toFixed(2);const mins=9*60+Math.floor(G.t*2),hh=Math.floor(mins/60),mm=mins%60;$('#hClock').textContent=`${(hh-1)%12+1}:${String(mm).padStart(2,'0')} ${hh>=12?'PM':'AM'}`;
  document.querySelector('.tab[data-s=order]').classList.toggle('alert',G.station!=='order'&&G.queue.length>0&&!G.taking);
  document.querySelector('.tab[data-s=sort]').classList.toggle('alert',G.station!=='sort'&&!S&&G.tickets.length>0);
  $('#takeBtn').style.display=G.queue.length&&!G.taking?'block':'none';}
requestAnimationFrame(frame);
$('#muteBtn').onclick=()=>{save.mute=!save.mute;writeSave();$('#muteBtn').textContent=save.mute?'🔇':'🔊'};
$('#muteBtn').textContent=save.mute?'🔇':'🔊';

/* ---------- title ---------- */
function showTitle(){G=null;S=null;showScreen('title');$('#titleNat').innerHTML=person(NAT,'happy');
  const b=$('#titleBtns'),cont=save.day>1||save.points>0;b.innerHTML='';
  const add=(t,c,f)=>{const x=document.createElement('button');x.className='btn '+c;x.innerHTML=t;x.onclick=()=>{SFX.blip();f()};b.appendChild(x)};
  add(cont?`Continue · Day ${save.day}`:'Play!','green pulse',startDay);
  if(cont)add('New Game','',()=>modal('<h2>Start over from Day 1?</h2><p style="font-weight:800">Your rank, points and tips will be reset.</p>',[['Cancel','blue'],['Reset','',()=>{save={day:1,points:0,tips:0,tut:false,mute:save.mute};writeSave();showTitle()}]]));
  add('How to Play','blue',()=>howTo());
}
showTitle();
</script>
